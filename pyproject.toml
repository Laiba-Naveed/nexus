[project]
name = "nexus-agent-security"
version = "0.1.0"
description = "A security middleware framework that validates AI agent tool calls and memory writes before execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Laiba Naveed" },
    { name = "Ayesha Waqar" },
    { name = "Syeda Sadaf Gillani" },
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
